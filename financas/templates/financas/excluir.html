{% extends 'financas/base.html' %}

{% block conteudo %}
<h2>Excluir</h2>

{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}

<p>Tem certeza que deseja excluir <strong>{{ objeto }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="botao vermelho">Sim, excluir</button>
    <a href="{% url voltar_para %}" class="botao cinza">Cancelar</a>
</form>
{% endblock %}
